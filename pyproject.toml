[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-names"
version = "0.1.0"
description = "Named vs unnamed: a generational LLM agent pilot"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.13,<2",
    "pyyaml>=6",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
agent-names = "agent_names.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
