# Smoke test against the real model: one seed, both arms, 2 generations of 2 rounds.
# About 175 model calls in total (a few cents on Haiku 5.5). Everything else matches the pilot.
seeds: [1]
arms: [named, unnamed]

population: 10
peak: 15
max_couples: 5
generations: 2
rounds: 2

reveal:
  hint: 1   # pulled forward so the smoke test exercises both reveal stages
  full: 2

mind:
  kind: anthropic
  model: claude-haiku-5-5
  effort: low
  max_tokens: 8000
  concurrency: 10
  budget_usd: 0.50

pricing:
  claude-haiku-5-5: {input: 0.10, output: 0.50}

output_dir: runs
